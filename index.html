<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="Picture-based Finnish species identification practice from four study PDFs.">
  <title>Species Guesser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-action="home" aria-label="Back to home"><span class="brand-mark">✦</span><span>Species Guesser</span></button>
      <div class="topbar-actions">
        <button class="icon-button" data-action="study" aria-label="Open study mode" title="Study mode">▤</button>
        <button class="icon-button" data-action="theme" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
      </div>
    </header>
    <main id="app" tabindex="-1"></main>
    <footer class="footer"><span>Built from four Finnish species-study PDFs</span><span class="footer-dot">•</span><span id="footer-count"></span></footer>
  </div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
